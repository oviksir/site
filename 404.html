<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена — ОВиКСиР</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
:root{--bg:#09111a;--text:#ecf4fd;--muted:#9eb1c6;--primary:#22b8ff;--accent:#ff8a1f}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg, rgba(7,12,18,.88), rgba(7,12,18,.96)), url('images/bg-metal.jpg') center top / 1200px auto repeat, var(--bg)}
.wrap{max-width:700px;padding:32px;text-align:center}
.card{padding:36px;border-radius:28px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg, rgba(15,25,38,.92), rgba(10,17,25,.94));box-shadow:0 24px 70px rgba(0,0,0,.35)}
img{height:64px;width:64px;object-fit:cover;border-radius:14px;margin:0 auto 18px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 16px 34px rgba(0,0,0,.35)}
h1{font-size:clamp(34px,8vw,58px);line-height:1;margin:0 0 12px}p{color:var(--muted);margin:0 0 22px}
a{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:14px;background:linear-gradient(90deg,var(--accent),#ffb44d);color:#09111a;text-decoration:none;font-weight:800}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img src="images/favicon.png" alt="ОВиКСиР">
      <h1>404</h1>
      <p>Страница не найдена. Вернитесь на главную и оставьте заявку — поможем с инженерными системами для вашего объекта.</p>
      <a href="./">На главную</a>
    </div>
  </div>
</body>
</html>
